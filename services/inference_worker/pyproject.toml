[project]
name = "inference-worker"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "redis>=5.0",
    "asyncpg>=0.29",
    "opencv-python-headless>=4.9",
    "numpy>=1.26",
    "ultralytics>=8.2",
    "onnxruntime>=1.17",   # CPU — swap for onnxruntime-gpu on GPU machines
    "httpx>=0.27",
]

[project.optional-dependencies]
gpu = ["onnxruntime-gpu>=1.17"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
inference-worker = "inference_worker.main:main_sync"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inference_worker"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
