[project]
name = "camera-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "opencv-python-headless>=4.9",
    "redis>=5.0",
    "yt-dlp>=2024.1",
    "psycopg2-binary>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
camera-agent = "camera_agent.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/camera_agent"]
