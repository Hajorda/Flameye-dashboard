# Production overrides — apply with: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  postgres:
    environment:
      # Override with strong credentials via environment or secrets manager
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in production}
    restart: always

  redis:
    restart: always

  camera_agent:
    restart: always

  inference_worker:
    restart: always
    # Uncomment for GPU:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  api_server:
    restart: always
    ports:
      - "127.0.0.1:8000:8000"   # Only expose to nginx, not public

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./services/dashboard/dist:/var/www/dashboard:ro
    depends_on:
      - api_server
    restart: always
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "3" }
