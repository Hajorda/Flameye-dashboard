# Flameye Redis configuration

# Persist to disk (RDB snapshot)
save 900 1
save 300 10
save 60 10000

# Enable AOF for durability
appendonly yes
appendfsync everysec

# Limit memory to prevent OOM — adjust for your server
maxmemory 512mb
maxmemory-policy allkeys-lru

# Streams: trim old entries aggressively to save memory
# The camera_agent already caps streams with MAXLEN, this is a safety net
stream-node-max-bytes 4096
stream-node-max-entries 100

# Logging
loglevel notice
